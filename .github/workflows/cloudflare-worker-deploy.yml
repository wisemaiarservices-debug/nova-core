name: Deploy NOVA Core API to Cloudflare Workers

on:
  # Production deployment is intentionally manual and main-branch-only.
  # Feature branches and pull-request refs must never deploy this Worker.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nova-core-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: Verify deployment ref is the protected default branch
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
      - name: Verify deployment credentials are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN GitHub secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret" && exit 1)
      - name: Install Python Worker dependencies
        run: uv sync --python 3.13 --project apps/api --all-groups
      - name: Deploy NOVA Core API
        working-directory: apps/api
        run: uv run --python 3.13 pywrangler deploy
