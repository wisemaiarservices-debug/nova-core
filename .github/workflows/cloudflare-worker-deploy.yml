name: Deploy NOVA Core API to Cloudflare Workers

on:
  # Production deployment is intentionally manual and main-branch-only.
  # Feature branches and pull-request refs must never deploy this Worker.
  workflow_dispatch:

# Prevent concurrent uploads of different revisions to the same production Worker.
# GitHub retains only the newest pending run for a concurrency group.
concurrency:
  group: nova-core-api-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nova-core-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Verify deployment ref is the protected default branch
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
      - name: Verify deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN GitHub secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret" && exit 1)
      - name: Require query-string redaction before production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          settings_file="$(mktemp)"
          trap 'rm -f "$settings_file"' EXIT
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nova-core-api/settings" \
            --output "$settings_file"
          jq -e '
            .success == true and
            .result.observability.redact_query_string == true
          ' "$settings_file" >/dev/null || {
            echo "Production deployment blocked: enable and verify Workers query-string redaction first."
            exit 1
          }
          echo "Workers query-string redaction is enabled; deployment preflight passed."
      - name: Install Python Worker build dependencies only
        run: uv sync --locked --python 3.13 --project apps/api --no-default-groups --group build
      - name: Deploy NOVA Core API
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --locked --python 3.13 --no-default-groups --group build pywrangler deploy
      - name: Verify deployed public API rate-limit binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          settings_file="$(mktemp)"
          trap 'rm -f "$settings_file"' EXIT
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nova-core-api/settings" \
            --output "$settings_file"
          jq -e '
            .success == true and
            ([.result.bindings[]? | select(.name == "NOVA_PUBLIC_API_LIMITER")] as $bindings |
              ($bindings | length) == 1 and
              $bindings[0].type == "ratelimit" and
              ($bindings[0].namespace_id | tostring) == "33226001" and
              $bindings[0].simple.limit == 60 and
              $bindings[0].simple.period == 60
            )
          ' "$settings_file" >/dev/null
          echo "Deployed NOVA_PUBLIC_API_LIMITER binding matches the reviewed 60/60 configuration."
      - name: Smoke-test a rate-limited public API route
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            -H "Content-Type: application/json" \
            --data '{"site_id":"post-deploy-smoke"}' \
            "https://nova-core-api.neohaven.workers.dev/api/v1/recommendations/run" \
            --output "$response_file"
          jq -e '.status == "review_required"' "$response_file" >/dev/null
          echo "Deployed public API route smoke check passed."
      - name: Verify deployed Worker health endpoint
        env:
          NOVA_HEALTH_URL: https://nova-core-api.neohaven.workers.dev/health
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 45 \
            --connect-timeout 10 --max-time 15 \
            "$NOVA_HEALTH_URL" --output "$response_file"
          jq -e '
            .status == "ok" and
            .service == "nova-core-api" and
            (.time | type == "string" and length > 0)
          ' "$response_file" >/dev/null
          echo "Deployed NOVA Core API health check passed."
