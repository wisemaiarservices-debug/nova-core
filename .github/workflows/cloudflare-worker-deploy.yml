name: Deploy NOVA Core API to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm deployment of the exact selected commit to the public NOVA Core API"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nova-core-api-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Deliberately manual-only. Dispatch must target the reviewed deployment
    # branch and explicitly set confirm_deploy=true. Ordinary pushes/PRs cannot deploy.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/nova-core-v1-provenance-and-honest-impact' && inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    environment: nova-core-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify deployment target and credentials
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/nova-core-v1-provenance-and-honest-impact"
          test -n "$GITHUB_SHA"
          echo "Selected deployment commit: $GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN GitHub secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret" && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: Install Python Worker dependencies
        run: uv sync --python 3.14 --project apps/api --all-groups
      - name: Deploy NOVA Core API
        working-directory: apps/api
        run: uv run --python 3.14 pywrangler deploy
