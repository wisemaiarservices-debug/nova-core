name: NOVA Core live API smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/nova-core-live-smoke.yml
  push:
    branches:
      - feat/nova-core-v1-provenance-and-honest-impact
    paths:
      - .github/workflows/nova-core-live-smoke.yml

permissions:
  contents: read

jobs:
  live-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live health endpoint
        run: |
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 https://nova-core-api.neohaven.workers.dev/health)"
          echo "$response"
          echo "$response" | jq -e '.status == "ok" and .service == "nova-core-api"'

      - name: Check NASA POWER daily retrieval
        run: |
          # Fixed public test coordinates and dates are connectivity fixtures only,
          # not a selected NeoHaven pilot site or operational recommendation.
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            'https://nova-core-api.neohaven.workers.dev/api/v1/data/weather/nasa-power/daily?latitude=36.8&longitude=10.2&start_date=2025-01-01&end_date=2025-01-07')"
          echo "$response" | jq '{status, data_source, data_product, data_interpretation, requested_location, requested_period}'
          echo "$response" | jq -e '.status == "retrieved" and .data_source == "NASA POWER Daily API" and (.data_interpretation | contains("not a local ground-station measurement"))'

      - name: Check NeoAgro CORS preflight
        run: |
          headers="$(curl --silent --show-error --dump-header - --output /dev/null \
            --request OPTIONS \
            --header 'Origin: https://neoagro-six.vercel.app' \
            --header 'Access-Control-Request-Method: GET' \
            --header 'Access-Control-Request-Headers: accept' \
            https://nova-core-api.neohaven.workers.dev/api/v1/data/weather/nasa-power/daily)"
          echo "$headers"
          echo "$headers" | grep -i 'access-control-allow-origin: https://neoagro-six.vercel.app'
