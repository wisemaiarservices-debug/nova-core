name: Private tenant Worker package readiness

on:
  pull_request:
    paths:
      - "apps/tenant-api/**"
      - "apps/tenant-gateway/**"
      - ".github/workflows/tenant-worker-package-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-api-package:
    name: Tenant API production-config dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify private API deployment invariants
        working-directory: apps/tenant-api
        run: |
          grep -qx 'workers_dev = false' wrangler.toml
          grep -qx 'preview_urls = false' wrangler.toml
          ! grep -Eq '^\s*(\[\[routes\]\]|\[\[env\..*\.routes\]\]|route\s*=|routes\s*=|workers_dev\s*=\s*true|preview_urls\s*=\s*true)' wrangler.toml
          ! grep -Eq '^\s*\[\[d1_databases\]\]' wrangler.toml
          ! grep -Eq '^\s*\[vars\]' wrangler.toml
      - name: Bundle production Worker config without deploying
        working-directory: apps/tenant-api
        run: npx --yes wrangler@4.13.2 deploy --dry-run --outdir /tmp/nova-tenant-api-dry-run --config wrangler.toml
      - name: Verify private API bundle exists
        run: test -s /tmp/nova-tenant-api-dry-run/index.js

  tenant-gateway-package:
    name: Tenant gateway production-config dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify gateway deployment invariants
        working-directory: apps/tenant-gateway
        run: |
          grep -qx 'workers_dev = false' wrangler.toml
          grep -qx 'preview_urls = false' wrangler.toml
          grep -Fqx 'service = "nova-core-tenant-api"' wrangler.toml
          grep -Fqx 'binding = "TENANT_API"' wrangler.toml
          ! grep -Eq '^\s*(\[\[routes\]\]|\[\[env\..*\.routes\]\]|route\s*=|routes\s*=|workers_dev\s*=\s*true|preview_urls\s*=\s*true)' wrangler.toml
          ! grep -Eq '^\s*\[vars\]' wrangler.toml
      - name: Bundle production Worker config without deploying
        working-directory: apps/tenant-gateway
        run: npx --yes wrangler@4.13.2 deploy --dry-run --outdir /tmp/nova-tenant-gateway-dry-run --config wrangler.toml
      - name: Verify gateway bundle exists
        run: test -s /tmp/nova-tenant-gateway-dry-run/index.js

  no-deployment:
    name: Assert this workflow cannot deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment commands are absent
        run: |
          ! grep -Eq 'wrangler(\.js)? deploy([[:space:]]|$)' .github/workflows/tenant-worker-package-readiness.yml
          ! grep -Eq 'CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|secrets\.' .github/workflows/tenant-worker-package-readiness.yml
