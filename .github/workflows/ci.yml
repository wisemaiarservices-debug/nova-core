name: NOVA Core CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/nova-core-v1-provenance-and-honest-impact
      - feat/nova-core-d1-persistence-foundation
      - feat/nova-d1-readonly-storage-status

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run Python API tests
        working-directory: apps/api
        run: pytest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/pyproject.toml
      - name: Bundle Python API Worker without deployment
        working-directory: apps/api
        run: |
          uv sync --python 3.13 --group dev
          uv run --python 3.13 pywrangler deploy --dry-run --config wrangler.jsonc
      - name: Bundle private tenant API Worker without deployment
        working-directory: apps/api
        run: uv run --python 3.13 pywrangler deploy --dry-run --config wrangler.tenant.jsonc
      - name: Bundle tenant nonce cleanup Worker without deployment
        working-directory: apps/api
        run: uv run --python 3.13 pywrangler deploy --dry-run --config wrangler.nonce-cleanup.jsonc
      - name: Exercise scheduled cleanup Worker with local D1 in workerd
        working-directory: apps/api
        run: bash scripts/test_nonce_cleanup_worker_local_d1.sh
      - name: Run ingestion Worker security tests
        working-directory: apps/ingestion-worker
        run: npm test
      - name: Run private tenant gateway security tests
        working-directory: apps/tenant-gateway
        run: npm test
      - name: Validate inert tenant gateway Worker bundle without deployment
        working-directory: apps/tenant-gateway
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
