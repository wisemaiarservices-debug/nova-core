name: NOVA Core CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/nova-core-v1-provenance-and-honest-impact
      - feat/nova-core-d1-persistence-foundation
      - feat/nova-d1-readonly-storage-status

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Python API tests
        working-directory: apps/api
        run: pytest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ingestion Worker security tests
        working-directory: apps/ingestion-worker
        run: npm test

  tenant-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test private tenant API Worker
        working-directory: apps/tenant-api
        run: npm test
      - name: Test Access tenant gateway Worker
        working-directory: apps/tenant-gateway
        run: npm test

  research-raster-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research raster dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-research.txt
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.3.4
      - name: Run WaPOR COG research tests
        run: python -m pytest apps/api/tests/test_wapor_cog_aoi_runner.py scripts/tests/test_wapor_cog_aoi_integration.py
