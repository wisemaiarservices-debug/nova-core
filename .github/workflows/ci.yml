name: NOVA Core CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/nova-core-v1-provenance-and-honest-impact
      - feat/nova-core-d1-persistence-foundation
      - feat/nova-d1-readonly-storage-status

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Python API tests
        working-directory: apps/api
        run: pytest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ingestion Worker security tests
        working-directory: apps/ingestion-worker
        run: npm test

  tenant-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test private tenant API Worker
        working-directory: apps/tenant-api
        run: npm test
      - name: Test Access tenant gateway Worker
        working-directory: apps/tenant-gateway
        run: npm test
      - name: Apply ordered migrations to disposable local D1
        working-directory: apps/tenant-api
        run: npx --yes wrangler@4.13.2 d1 migrations apply DB --local --config wrangler.d1-test.toml --persist-to ./.wrangler-d1-test
      - name: Prepare tenant API queries against local D1 schema
        working-directory: apps/tenant-api
        run: npx --yes wrangler@4.13.2 d1 execute DB --local --config wrangler.d1-test.toml --persist-to ./.wrangler-d1-test --file ./test/d1-query-compatibility.sql
      - name: Seed isolated local D1 HTTP fixtures
        working-directory: apps/tenant-api
        run: npx --yes wrangler@4.13.2 d1 execute DB --local --config wrangler.d1-test.toml --persist-to ./.wrangler-d1-test --file ./test/d1-http-fixtures.sql
      - name: Seed exact-scope synthetic evidence and approved rights fixtures
        working-directory: apps/tenant-api
        run: node ./scripts/seed-source-rights-test-fixtures.mjs
      - name: Test source evidence and rights lifecycle rowid ordering against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-source-rights-event-order-tests.mjs
      - name: Seed approved capability and observation fixtures after rights verification
        working-directory: apps/tenant-api
        run: npx --yes wrangler@4.13.2 d1 execute DB --local --config wrangler.d1-test.toml --persist-to ./.wrangler-d1-test --file ./test/d1-http-capability-observation-fixtures.sql
      - name: Execute read-only source rights impact inventory against disposable local D1
        working-directory: apps/tenant-api
        run: npx --yes wrangler@4.13.2 d1 execute DB --local --config wrangler.d1-test.toml --persist-to ./.wrangler-d1-test --file ./scripts/read-only-source-rights-impact-inventory.sql
      - name: Test source evidence and data-rights governance against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-source-evidence-rights-tests.mjs
      - name: Test source capability lifecycle rejection guards against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-capability-lifecycle-tests.mjs
      - name: Test source capability creation idempotency against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-source-capability-idempotency-tests.mjs
      - name: Test source capability event idempotency against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-source-capability-event-idempotency-tests.mjs
      - name: Test source calibration profile registry guards against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-calibration-profile-tests.mjs
      - name: Verify internal request nonce uniqueness against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-internal-request-nonce-check.mjs
      - name: Exercise gateway and private Worker over local Service Bindings + D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-http-integration.mjs
      - name: Test observation capability commit guard against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-observation-capability-tests.mjs
      - name: Test overlapping approved observation capabilities against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-observation-capability-overlap-tests.mjs
      - name: Test source capability quality-flag allow-list guard against local D1
        working-directory: apps/tenant-api
        run: node ./scripts/d1-capability-quality-flags-tests.mjs
      - name: Test source rights capability approval and observation commit guards
        working-directory: apps/tenant-api
        run: node ./scripts/d1-source-rights-enforcement-tests.mjs

  research-raster-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research raster dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-research.txt
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.3.4
      - name: Run WaPOR COG research tests
        run: python -m pytest apps/api/tests/test_wapor_cog_aoi_runner.py scripts/tests/test_wapor_cog_aoi_integration.py

  private-worker-package-readiness:
    name: Private tenant Worker package readiness (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify private API production config
        working-directory: apps/tenant-api
        run: |
          grep -qx 'workers_dev = false' wrangler.toml
          grep -qx 'preview_urls = false' wrangler.toml
          ! grep -Eq '^[[:space:]]*(\\[\\[routes\\]\\]|\\[\\[env\\..*\\.routes\\]\\]|route[[:space:]]*=|routes[[:space:]]*=|workers_dev[[:space:]]*=[[:space:]]*true|preview_urls[[:space:]]*=[[:space:]]*true)' wrangler.toml
          ! grep -Eq '^[[:space:]]*\\[\\[d1_databases\\]\\]' wrangler.toml
          ! grep -Eq '^[[:space:]]*\\[vars\\]' wrangler.toml
      - name: Bundle private API without deployment
        working-directory: apps/tenant-api
        run: npx --yes wrangler@4.13.2 deploy --dry-run --outdir /tmp/nova-tenant-api-dry-run --config wrangler.toml
      - name: Verify private API bundle
        run: test -s /tmp/nova-tenant-api-dry-run/index.js
      - name: Verify gateway production config
        working-directory: apps/tenant-gateway
        run: |
          grep -qx 'workers_dev = false' wrangler.toml
          grep -qx 'preview_urls = false' wrangler.toml
          grep -Fqx 'service = "nova-core-tenant-api"' wrangler.toml
          grep -Fqx 'binding = "TENANT_API"' wrangler.toml
          ! grep -Eq '^[[:space:]]*(\\[\\[routes\\]\\]|\\[\\[env\\..*\\.routes\\]\\]|route[[:space:]]*=|routes[[:space:]]*=|workers_dev[[:space:]]*=[[:space:]]*true|preview_urls[[:space:]]*=[[:space:]]*true)' wrangler.toml
          ! grep -Eq '^[[:space:]]*\\[vars\\]' wrangler.toml
      - name: Bundle gateway without deployment
        working-directory: apps/tenant-gateway
        run: npx --yes wrangler@4.13.2 deploy --dry-run --outdir /tmp/nova-tenant-gateway-dry-run --config wrangler.toml
      - name: Verify gateway bundle
        run: test -s /tmp/nova-tenant-gateway-dry-run/index.js

  ingestion-worker-config-readiness:
    name: Private ingestion Worker config readiness (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify canonical private ingestion Worker config
        working-directory: apps/ingestion-worker
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8")); if(c.name!=="nova-core-ingest-api" || c.main!=="src/index.mjs" || c.workers_dev!==false || c.preview_urls!==false) process.exit(1); if(c.d1_databases || c.routes || c.route || c.vars) process.exit(1);'
          test ! -e wrangler.toml
      - name: Bundle private ingestion Worker without deployment
        working-directory: apps/ingestion-worker
        run: npx --yes wrangler@4.13.2 deploy --dry-run --outdir /tmp/nova-ingestion-worker-dry-run --config wrangler.jsonc
      - name: Verify private ingestion Worker bundle
        run: test -s /tmp/nova-ingestion-worker-dry-run/index.js

  python-worker-rate-limit-binding-proof:
    name: Python Worker Rate Limiting binding proof (local only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
      - name: Verify isolated dependency lock is current
        working-directory: apps/api/tests/rate_limit_binding_proof
        run: uv lock --check
      - name: Install isolated Python Worker SDK from committed lock
        working-directory: apps/api/tests/rate_limit_binding_proof
        run: uv sync --locked
      - name: Test binding exceptions fail closed
        working-directory: apps/api/tests/rate_limit_binding_proof
        run: uv run --locked --project . python -m unittest test_probe.py
      - name: Verify local Rate Limiting binding and Python FFI behavior
        working-directory: apps/api/tests/rate_limit_binding_proof
        run: node ./check.mjs . ./wrangler.jsonc rate-limit
      - name: Verify missing binding fails closed
        working-directory: apps/api/tests/rate_limit_binding_proof
        env:
          PORT: "8792"
        run: node ./check.mjs . ./wrangler-no-binding.jsonc missing-binding
