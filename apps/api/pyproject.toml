[project]
name = "nova-core-api"
version = "0.2.0"
description = "NOVA Core V1 API for transparent, provenance-aware infrastructure screening"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.12.4",
  "workers-runtime-sdk==1.9.7",
]

[dependency-groups]
dev = [
  "workers-py==1.17.8",
  "pytest",
  "httpx",
]

[tool.setuptools.packages.find]
include = ["services*"]
exclude = ["migrations*", "tests*"]
